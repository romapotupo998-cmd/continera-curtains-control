
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111315">
  <title>Continera Curtains Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111315;
      color: #f2f4f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: #1b1f22;
      border: 1px solid #30383c;
      border-radius: 20px;
      padding: 25px;
    }

    .brand {
      color: #55d6c2;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin: 10px 0 5px;
    }

    .subtitle {
      color: #929da2;
      font-size: 14px;
    }

    .percentage {
      text-align: center;
      margin: 35px 0 25px;
    }

    .percentage strong {
      font-size: 55px;
      color: #55d6c2;
    }

    .percentage p {
      color: #929da2;
      margin: 5px 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #55d6c2;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: #929da2;
      font-size: 12px;
      margin-top: 10px;
    }

    .status {
      margin-top: 30px;
      padding: 15px;
      background: #252c30;
      border-radius: 12px;
      text-align: center;
      color: #55d6c2;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="brand">CONTINERA</div>

    <h1>Curtains Control</h1>
    <div class="subtitle">DAF XG+ • Cabin System</div>

    <div class="percentage">
      <strong id="value">0%</strong>
      <p>Положення штор</p>
    </div>

    <input
      type="range"
      id="curtainSlider"
      min="0"
      max="100"
      value="0"
    >

    <div class="range-labels">
      <span>Відкриті</span>
      <span>Закриті</span>
    </div>

    <div class="status" id="status">
      Штори відкриті
    </div>
  </main>

  <script>
    const slider = document.getElementById("curtainSlider");
    const value = document.getElementById("value");
    const status = document.getElementById("status");

    slider.addEventListener("input", () => {
      const position = Number(slider.value);

      value.textContent = position + "%";

      if (position === 0) {
        status.textContent = "Штори відкриті";
      } else if (position === 100) {
        status.textContent = "Штори закриті";
      } else {
        status.textContent = "Штори частково закриті";
      }
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111315">

<title>Continera Curtains Control</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111315;
  color: #f2f4f5;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.panel {
  width: 100%;
  max-width: 420px;
  background: #1b1f22;
  border: 1px solid #30383c;
  border-radius: 20px;
  padding: 25px;
}

.brand {
  color: #55d6c2;
  font-size: 13px;
  letter-spacing: 3px;
  font-weight: bold;
}

h1 {
  font-size: 25px;
  margin: 10px 0 5px;
}

.subtitle {
  color: #929da2;
  font-size: 14px;
}

/* Вікно кабіни */

.window {
  position: relative;
  width: 100%;
  height: 190px;
  margin-top: 30px;
  overflow: hidden;
  border: 4px solid #414b50;
  border-radius: 14px;

  background: linear-gradient(
    180deg,
    #344c5a,
    #8299a2
  );

  --position: 0;
}

.window::before {
  content: "";
  position: absolute;
  inset: 0;

  background: linear-gradient(
    180deg,
    transparent 65%,
    #26343b 100%
  );
}


.curtain {
  position: absolute;
  top: 0;
  bottom: 0;
  width: calc(var(--position) * 0.5%);

  background:
    repeating-linear-gradient(
      90deg,
      rgba(0, 0, 0, 0.25) 0px,
      rgba(0, 0, 0, 0.25) 3px,
      transparent 5px,
      transparent 13px,
      rgba(255, 255, 255, 0.10) 16px,
      transparent 20px,
      transparent 25px
    ),
    linear-gradient(
      90deg,
      #1c3035,
      #3b5c61 25%,
      #263e43 50%,
      #3b5c61 75%,
      #1c3035
    );

  box-shadow:
    inset 5px 0 10px rgba(0, 0, 0, 0.3),
    inset -5px 0 10px rgba(0, 0, 0, 0.3);

  transition: width 0.35s ease;
  z-index: 2;
}

.curtain.left {
  left: 0;
  border-right: 1px solid rgba(255,255,255,0.15);
}

.curtain.right {
  right: 0;
  border-left: 1px solid rgba(255,255,255,0.15);
}
  

.window-frame {
  position: absolute;
  inset: 0;
  border: 3px solid #69777d;
  z-index: 3;
  pointer-events: none;
}

.percentage {
  text-align: center;
  margin: 30px 0 25px;
}

.percentage strong {
  font-size: 55px;
  color: #55d6c2;
}

.percentage p {
  color: #929da2;
  margin: 5px 0;
}

input[type="range"] {
  width: 100%;
  accent-color: #55d6c2;
  cursor: pointer;
}

.range-labels {
  display: flex;
  justify-content: space-between;
  color: #929da2;
  font-size: 12px;
  margin-top: 10px;
}

.status {
  margin-top: 30px;
  padding: 15px;
  background: #252c30;
  border-radius: 12px;
  text-align: center;
  color: #55d6c2;
  font-size: 14px;
}
</style>
</head>

<body>

<main class="panel">

  <div class="brand">CONTINERA</div>

  <h1>Curtains Control</h1>
  <div class="subtitle">DAF XG+ • Cabin System</div>

  <div class="window" id="window">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <div class="window-frame"></div>
  </div>

  <div class="percentage">
    <strong id="value">0%</strong>
    <p>Положення штор</p>
  </div>

  <input
    type="range"
    id="curtainSlider"
    min="0"
    max="100"
    value="0"
  >

  <div class="range-labels">
    <span>Відкриті</span>
    <span>Закриті</span>
  </div>

  <div class="status" id="status">
    Штори відкриті
  </div>

</main>

<script>
const slider = document.getElementById("curtainSlider");
const value = document.getElementById("value");
const status = document.getElementById("status");
const windowElement = document.getElementById("window");

const STORAGE_KEY = "contineraCurtainsPosition";

// Оновлення положення штор
function updateCurtains(position) {

  position = Math.max(0, Math.min(100, Number(position)));

  slider.value = position;
  value.textContent = position + "%";

  // Передаємо положення безпосередньо у CSS
  windowElement.style.setProperty(
    "--position",
    position
  );

  // Оновлення статусу
  if (position === 0) {
    status.textContent = "Штори відкриті";
  } else if (position === 100) {
    status.textContent = "Штори закриті";
  } else {
    status.textContent = "Штори частково закриті";
  }
}

// Завантаження збереженого положення
const savedPosition = localStorage.getItem(STORAGE_KEY);

let initialPosition = 0;

if (
  savedPosition !== null &&
  savedPosition.trim() !== "" &&
  Number.isFinite(Number(savedPosition)) &&
  Number(savedPosition) >= 0 &&
  Number(savedPosition) <= 100
) {
  initialPosition = Number(savedPosition);
}

// Зміна повзунка
slider.addEventListener("input", () => {

  const position = Number(slider.value);

  localStorage.setItem(STORAGE_KEY, position);

  updateCurtains(position);
});

// Початкове відображення
updateCurtains(initialPosition);

</script>

</body>
</html>
